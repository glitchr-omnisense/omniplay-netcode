# A release on a pushed tag vX.Y.Z: this package's CI on the tagged commit (ci.yml, called), then the
# checks (the tag is package.json's version, CHANGELOG.md has its section) and the GitHub release, its
# notes from the changelog, with the UPM tarball attached (npm pack: what Unity's Package Manager
# installs from a tarball). Unity users install the tag by Git URL (#vX.Y.Z); no registry is fed
# from here (OpenUPM, if wanted, picks tags up by itself once the package is submitted there).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is package.json's version, the changelog has its section
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          declared=$(jq -r .version package.json)
          if [ "$declared" != "$version" ]; then echo "::error::package.json says $declared, the tag $GITHUB_REF_NAME."; exit 1; fi
          awk -v v="$version" '/^## /{ if (found) exit; h=$0; gsub(/[\[\]]/, "", h); split(h, w, /[ \t]+/); if (w[2] == v) { found=1; next } } found' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section ## [$version]."; exit 1; fi
          case "$version" in *-*|0.*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      - name: The UPM tarball
        run: npm pack

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md ${{ steps.version.outputs.prerelease }} io.omniplay.*.tgz
